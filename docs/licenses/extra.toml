# Hand-kept BOM entries for `cargo xtask licenses` (docs/licenses/README.md).
#
# Cargo.lock and web/package-lock.json are read automatically; this file
# covers what no lockfile pins: toolchains, Docker base images, distro
# packages, ship tooling and the plant worker stack. Bump a `version`
# when the thing it names changes; the page regenerates on the next
# `ci` because this file is part of its input hash.
#
# scope tags: app (production web server and SPA), worker (xtask:
# plant worker, timers, ops), build (builds and ships a release),
# test (CI and rehearsal only), image (the judge Docker image).
#
# license: an SPDX expression. Every id needs a text in texts/: SPDX ids
# are fetched once from spdx/license-list-data; LicenseRef-* texts are
# kept by hand in texts/ and named in texts/index.toml.

# Which Dockerfiles to read `FROM` lines from, and their scope tag.
[dockerfiles]
"ops/judge/Dockerfile" = "image"
"ops/rehearsal/Dockerfile" = "test"

# Licence of each base image a `FROM` line names (matched on the image
# name before the tag). An image with no entry here fails generation.
[[image]]
name = "node"
url = "https://hub.docker.com/_/node"
license = "MIT AND LicenseRef-OS-Distribution"
copyright = "Copyright (c) the Node.js Docker Team"

[[image]]
name = "rust"
url = "https://hub.docker.com/_/rust"
license = "(MIT OR Apache-2.0) AND LicenseRef-OS-Distribution"
copyright = "Copyright (c) The Rust Project Developers"

[[image]]
name = "debian"
url = "https://hub.docker.com/_/debian"
license = "LicenseRef-OS-Distribution"
copyright = "Copyright (c) Software in the Public Interest, Inc. and the Debian contributors"

[[image]]
name = "ubuntu"
url = "https://hub.docker.com/_/ubuntu"
license = "LicenseRef-OS-Distribution"
copyright = "Copyright (c) Canonical Ltd. and the Ubuntu contributors"

