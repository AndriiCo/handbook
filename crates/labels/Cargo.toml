[package]
name = "labels"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No `ring`: the workspace TLS provider is aws-lc-rs (axum-server);
# enabling `ring` too makes rustls unable to pick a process default.
ureq = { version = "3", default-features = false, features = [
    "gzip",
    "json",
    "rustls-no-provider",
    "rustls-webpki-roots",
] }
