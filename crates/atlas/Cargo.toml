[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
# No `ring`: the workspace TLS provider is aws-lc-rs; ureq runs
# provider-less with webpki roots (ingest/media precedent).
ureq = { version = "3", default-features = false, features = [
    "json",
    "multipart",
    "rustls-no-provider",
    "rustls-webpki-roots",
] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[dev-dependencies]
tempfile = "3"
