[package]
name = "web"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
acme = { path = "../acme" }
auth = { path = "../auth" }
base64 = "0.22"
config = { path = "../config" }
forms = { path = "../forms" }
handbook-store = { path = "../handbook-store" }
ingest = { path = "../ingest" }
labels = { path = "../labels" }
media = { path = "../media" }
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voice = { path = "../voice" }

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
rcgen = "0.13"
rustls = "0.23"
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
