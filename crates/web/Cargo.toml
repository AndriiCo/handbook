[package]
name = "web"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
acme = { path = "../acme" }
auth = { path = "../auth" }
base64 = "0.22"
bytes = "1"
config = { path = "../config" }
contracts = { path = "../contracts" }
forms = { path = "../forms" }
handbook-store = { path = "../handbook-store" }
ingest = { path = "../ingest" }
labels = { path = "../labels" }
media = { path = "../media" }
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-rustls = "0.26"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voice = { path = "../voice" }
# Native QUIC (single-443 spec §2): aws-lc-rs provider ONLY — never
# quinn's default `rustls-ring` (workspace TLS rule, no `ring`).
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
# Both-SANs boot check (single-443 spec §1.3); already in the tree
# via acme, added here as a direct dep for the web crate's use.
x509-parser = "0.18"
# Passkeys (spec customer-auth.md §0):
# danger-allow-state-serialisation is the documented safe case
# (ceremony state in server-side SQLite, single-use).
# No `ring`: crypto backend is openssl (workspace TLS rule).
# (conditional-ui arrives with §2.5 autofill in Phase 4.)
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
# Google OAuth token/tokeninfo calls (spec customer-auth.md §9):
# blocking ureq on spawn_blocking (voice/labels precedent).
# `rustls-no-provider` + explicit `aws-lc-rs` install at first use
# (ingest precedent — ureq's default would pull ring as a second
# provider and rustls refuses); roots are bundled webpki-roots.
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "rustls-webpki-roots",
] }
# Vendored OpenSSL for hermetic builds: Mac system OpenSSL is v4
# (openssl-sys may reject it) and zigbuild cross targets have no
# system libs. Precedent: rusqlite bundled, aws-lc-sys.
openssl-sys = { version = "0.9", features = ["vendored"] }
# Magic-link SMTP (spec customer-auth.md §12.8): lettre SMTP with
# the ring-free pin — `rustls` (no provider) + `rustls-no-provider`
# + `aws-lc-rs`, webpki roots. NEVER the `rustls-tls` feature:
# it pulls `ring` as a second rustls provider (workspace TLS rule).
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "rustls",
    "rustls-no-provider",
    "aws-lc-rs",
    "webpki-roots",
    "hostname",
] }

[dev-dependencies]
aws-lc-rs = "1"
ed25519-dalek = "2"
# Apple OAuth tests mint id_tokens with the fixture key (same
# spec as the auth crate; already locked — zero lock churn).
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
tempfile = "3"
rcgen = "0.13"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
