[package]
name = "web"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
acme = { path = "../acme" }
auth = { path = "../auth" }
base64 = "0.22"
bytes = "1"
config = { path = "../config" }
forms = { path = "../forms" }
handbook-store = { path = "../handbook-store" }
ingest = { path = "../ingest" }
labels = { path = "../labels" }
media = { path = "../media" }
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = "0.23"
rustls-pemfile = "2"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-rustls = "0.26"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voice = { path = "../voice" }
# Native QUIC (single-443 spec §2): aws-lc-rs provider ONLY — never
# quinn's default `rustls-ring` (workspace TLS rule, no `ring`).
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
# Both-SANs boot check (single-443 spec §1.3); already in the tree
# via acme, added here as a direct dep for the web crate's use.
x509-parser = "0.18"

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
rcgen = "0.13"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
