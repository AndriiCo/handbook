[package]
name = "acme"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
instant-acme = { version = "0.8.5", features = ["time", "x509-parser"] }
rand = "0.9"
rcgen = "0.13"
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time"] }
tracing = "0.1"
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
