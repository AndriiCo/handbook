[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1"
base64 = "0.22"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Apple OAuth (spec customer-auth.md §10): ES256 client_secret
# signing + id_token verification. `aws_lc_rs` backend on the
# workspace provider (verified ring-free manifest); default
# `use_pem` kept for `from_ec_pem` (Apple .p8 = PKCS#8).
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

[dev-dependencies]
tempfile = "3"
