[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
contracts = { path = "../crates/contracts" }
handbook-agent = { path = "../crates/handbook-agent" }
handbook-store = { path = "../crates/handbook-store" }
ingest = { path = "../crates/ingest" }
mcp = { path = "../crates/mcp" }
publish = { path = "../crates/publish" }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.9"
chacha20poly1305 = { version = "0.10" }
zeroize = "1"
rcgen = "0.13"
rustls-pemfile = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = { version = "0.8", features = ["parse"] }
# quic-probe (same QUIC stack as web; aws-lc-rs only, no ring).
bytes = "1"
futures-util = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
