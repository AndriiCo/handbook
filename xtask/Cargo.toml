[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
atlas = { path = "../crates/atlas" }
auth = { path = "../crates/auth" }
callcache = { path = "../crates/callcache" }
instruct = { path = "../crates/instruct" }
contracts = { path = "../crates/contracts" }
forms = { path = "../crates/forms" }
handbook-agent = { path = "../crates/handbook-agent" }
handbook-store = { path = "../crates/handbook-store" }
ingest = { path = "../crates/ingest" }
labels = { path = "../crates/labels" }
mail = { path = "../crates/mail" }
mcp = { path = "../crates/mcp" }
publish = { path = "../crates/publish" }
voice = { path = "../crates/voice" }
ed25519-dalek = "2"
base64 = "0.22"
# Aliased: `mod config` in src/main.rs is the config-* CLI commands.
sealed_config = { path = "../crates/config", package = "config" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tempfile = "3"
rand = "0.9"
chacha20poly1305 = { version = "0.10" }
zeroize = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# setup wizard (localhost only) and the provider key checks.
axum = "0.8"
futures-util = "0.3"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "rustls-webpki-roots",
] }
toml = { version = "0.8", features = ["parse"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# (tempfile lives in [dependencies]: demo-vietnam needs it at runtime.)
